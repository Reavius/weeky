<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F7F5">
<meta name="description" content="Weeky — недельный планер: 7 дней, умный ввод, напоминания, архив и статистика.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Weeky">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Weeky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@600;800&family=Golos+Text:wght@400;500;600;700&display=swap">
<style>
:root{
  /* Layout: one-screen phone planner — header, a taped "Tasks" note, then seven full-bleed day bands stepping through the theme gradient; sheets, drawer and side screens slide over it. Theme tokens are rewritten by JS when the user picks a palette. */
  --bg:#F7F7F5;
  --paper:#FFFFFF;
  --ink:#1A1A1A;
  --muted:#76767A;
  --line:rgba(26,26,26,.12);
  --accent:#FF5A1F;
  --accent-ink:#FFFFFF;
  --note:#FFFFFF;
  --note-ink:#1A1A1A;
  --note-line:rgba(26,26,26,.07);
  --danger:#D6342C;
  --f-display:"Fira Sans Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --gl:max(16px, env(safe-area-inset-left, 0px));
  --gr:max(16px, env(safe-area-inset-right, 0px));
  --bl:max(24px, env(safe-area-inset-left, 0px));
  --br:max(22px, env(safe-area-inset-right, 0px));
  --kb:0px;
  color-scheme:light;
}
html{height:100%;box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;transition:background-color .6s var(--ease),color .6s var(--ease)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;-webkit-tap-highlight-color:transparent;text-align:inherit}
input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
svg{display:block}
ul{list-style:none;margin:0;padding:0}
h1,h2,h3,p{margin:0}

/* ---------- app shell ---------- */
#app{height:100%;display:flex;flex-direction:column;position:relative;padding-top:env(safe-area-inset-top,0px);max-width:560px;margin:0 auto;background:var(--bg);transition:transform .45s var(--ease),border-radius .45s var(--ease),background-color .6s var(--ease)}
body.drawer-open #app{transform:translateX(26px) scale(.955);border-radius:22px;overflow:hidden}
.top{flex:none;display:grid;grid-template-columns:44px minmax(0,1fr) 44px;align-items:center;gap:6px;padding-block:8px 10px;padding-left:var(--gl);padding-right:var(--gr);background:var(--bg);position:relative;z-index:2;transition:background-color .6s var(--ease)}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:14px;color:var(--ink)}
.icon-btn:active{background:var(--line)}
.icon-btn.sm{width:36px;height:36px;border-radius:12px}
.wk{display:flex;align-items:center;justify-content:center;gap:2px;min-width:0}
.wk-arrow{width:32px;height:40px;display:grid;place-items:center;color:var(--muted);border-radius:10px}
.wk-label{display:flex;flex-direction:column;align-items:center;min-width:0;padding:2px 6px}
.wk-range{font-weight:700;font-size:16px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;font-variant-numeric:tabular-nums}
.wk-sub{font-size:12px;color:var(--muted);white-space:nowrap}
.wk-sub b{color:var(--accent);font-weight:600}

#scroller{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;touch-action:pan-y;position:relative}
.filter-bar{display:flex;align-items:center;gap:10px;padding:2px var(--gr) 6px var(--gl);font-size:13px;color:var(--muted)}
.filter-bar .chip{padding:6px 10px 6px 12px}

/* ---------- inbox note ---------- */
.note{position:relative;margin:10px var(--gr) 18px var(--gl);background-color:var(--note);color:var(--note-ink);border-radius:3px 3px 20px 3px;box-shadow:0 1px 0 rgba(0,0,0,.05),0 14px 30px -18px rgba(0,0,0,.45);transition:background-color .6s var(--ease),color .6s var(--ease),transform .25s var(--ease),box-shadow .25s}
.note::before{content:"";position:absolute;top:-10px;left:50%;width:76px;height:20px;transform:translateX(-50%) rotate(-2.5deg);background:var(--accent);opacity:.32;border-radius:2px;pointer-events:none}
.note-head{display:grid;grid-template-columns:auto auto 1fr auto;align-items:center;column-gap:10px;width:100%;padding:18px 16px 14px 18px;text-align:left}
.note-title{font-family:var(--f-display);font-weight:800;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.01em}
.note-count{font-weight:600;font-size:13px;min-width:24px;height:24px;padding:0 7px;border-radius:99px;display:grid;place-items:center;background:var(--note-line);font-variant-numeric:tabular-nums}
.note-chev{grid-column:4;opacity:.55;transition:transform .35s var(--ease)}
.note.open .note-chev{transform:rotate(180deg)}
.note-prev{grid-column:1 / -1;margin-top:8px;font-size:14px;opacity:.6;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .42s var(--ease)}
.note.open .note-body{grid-template-rows:1fr}
.note-inner{overflow:hidden;min-height:0}
.note-pad{padding:0 16px 14px 18px;background-image:repeating-linear-gradient(to bottom,transparent 0 41px,var(--note-line) 41px 42px)}
.note-add{display:flex;align-items:center;gap:10px;padding:6px 0 4px}
.note-add .plus{opacity:.5;flex:none}
.note-add input{flex:1;min-width:0;border:0;background:transparent;font-size:16px;padding:10px 0;outline:none;color:var(--note-ink)}
.note-add input::placeholder{color:currentColor;opacity:.45}
.note-go{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none;opacity:0;transform:scale(.6);transition:opacity .2s,transform .25s var(--ease)}
.note-add.has-text .note-go{opacity:1;transform:none}
.note.drop-hover{transform:scale(1.02) rotate(-.4deg);box-shadow:0 0 0 3px var(--accent),0 20px 40px -18px rgba(0,0,0,.5)}

/* ---------- day bands ---------- */
.week{position:relative;will-change:transform}
.band{background:var(--b-bg);color:var(--b-ink);position:relative;transition:background-color .6s var(--ease),color .6s var(--ease)}
.band-head{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:12px;row-gap:5px;align-items:center;width:100%;text-align:left;padding-block:22px 19px;padding-left:var(--bl);padding-right:var(--br)}
.band-name{grid-column:1;grid-row:1;font-family:var(--f-display);font-weight:800;font-size:clamp(30px,9.4vw,42px);line-height:.95;text-transform:uppercase;letter-spacing:.005em;overflow-wrap:anywhere;transition:transform .35s var(--ease),opacity .3s}
.band.past .band-name{opacity:.5}
.band-date{grid-column:1;grid-row:2;display:flex;align-items:center;gap:8px;font-size:14px;font-variant-numeric:tabular-nums}
.band-date span:first-child{opacity:.66}
.pill{background:var(--accent);color:var(--accent-ink);font-size:10.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px 2px;border-radius:99px}
.band-side{grid-column:2;grid-row:1 / span 2;display:flex;flex-direction:column;align-items:flex-end;gap:7px}
.dots{display:flex;gap:4px;align-items:center}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--c,currentColor);box-shadow:0 0 0 1.5px var(--b-bg)}
.dots b{font-size:12px;font-weight:600;opacity:.7;margin-left:2px}
.done-n{display:flex;align-items:center;gap:3px;font-size:12px;font-weight:600;opacity:.6;font-variant-numeric:tabular-nums}
.band-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .44s var(--ease)}
.band.open .band-body{grid-template-rows:1fr}
.band-inner{overflow:hidden;min-height:0}
.band-pad{padding:0 var(--br) 18px var(--bl)}
.band.drop-hover{filter:brightness(1.06)}
.band.drop-hover .band-name{transform:translateX(8px)}
.band.drop-hover::after{content:"";position:absolute;inset:0;box-shadow:inset 0 0 0 3px var(--accent);pointer-events:none}
.band.flash::after{content:"";position:absolute;inset:0;background:var(--b-ink);opacity:0;animation:flash .9s var(--ease);pointer-events:none}
@keyframes flash{0%{opacity:0}20%{opacity:.14}100%{opacity:0}}
.empty{font-size:14px;opacity:.6;padding:4px 0 8px}
.add-row{display:flex;align-items:center;gap:12px;padding:10px 0 6px;font-size:15px;opacity:.6;width:100%}
.add-row:active{opacity:1}
.add-row .plusbox{width:24px;height:24px;border-radius:7px;border:2px dashed currentColor;display:grid;place-items:center;flex:none}
.done-toggle{display:inline-flex;align-items:center;gap:6px;margin-top:8px;padding:6px 10px 6px 8px;border-radius:99px;font-size:13px;font-weight:600;background:rgba(127,127,127,.14)}
.done-toggle .chev{transition:transform .3s var(--ease)}
.done-toggle[aria-expanded="true"] .chev{transform:rotate(180deg)}
.done-list{margin-top:6px}

/* ---------- task rows ---------- */
.tasks{display:flex;flex-direction:column}
.task{display:flex;align-items:flex-start;gap:12px;padding:9px 0;position:relative;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:pan-y}
.check{flex:none;width:24px;height:24px;margin-top:1px;border-radius:7px;border:2px solid currentColor;display:grid;place-items:center;color:inherit;position:relative;transition:background-color .25s,border-color .25s,transform .2s}
.task:not(.has-sec) .check{border-color:currentColor;opacity:.75}
.task.has-sec .check{border-color:var(--sec)}
.check svg{width:16px;height:16px;stroke:#fff;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:24;stroke-dashoffset:24;transition:stroke-dashoffset .35s var(--ease) .05s}
.task.is-done .check,.task.completing .check{background:var(--sec,var(--accent));border-color:var(--sec,var(--accent));opacity:1}
.task.is-done .check svg,.task.completing .check svg{stroke-dashoffset:0}
.task.completing .check{animation:pop .45s var(--ease)}
@keyframes pop{0%{transform:scale(1)}35%{transform:scale(.78)}70%{transform:scale(1.18)}100%{transform:scale(1)}}
.t-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px;text-align:left;padding-top:2px}
.t-title{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.tx{background-image:linear-gradient(currentColor,currentColor);background-repeat:no-repeat;background-position:0 58%;background-size:0% 1.6px;transition:background-size .5s var(--ease)}
.task.is-done .tx,.task.completing .tx{background-size:100% 1.6px}
.task.is-done .t-title{opacity:.6}
.task.completing .t-title{opacity:.75;transition:opacity .5s}
.t-meta{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;opacity:.72}
.t-sec{display:inline-flex;align-items:center;gap:5px;font-weight:500}
.t-sec i{width:7px;height:7px;border-radius:50%;background:var(--sec)}
.t-carry{display:inline-flex;align-items:center;gap:4px;font-weight:600}
.t-assign{flex:none;width:34px;height:34px;margin:-5px -6px -5px 0;display:grid;place-items:center;border-radius:10px;opacity:.6}
.t-assign.on{opacity:1;background:var(--note-line)}
.task.collapsing{height:0!important;padding-block:0!important;opacity:0;transition:height .32s var(--ease),padding .32s var(--ease),opacity .22s}
.task.dragging-src{opacity:.22}
.task.ghost{position:fixed;z-index:70;margin:0;padding:10px 14px;border-radius:14px;pointer-events:none;box-shadow:0 22px 44px -14px rgba(0,0,0,.5),0 0 0 1px rgba(0,0,0,.05);transform-origin:30% 50%;will-change:transform}
.assign-strip{padding:2px 0 10px 36px}
.assign-strip .chips{margin:0;padding:0}

/* ---------- foot ---------- */
.foot{display:flex;gap:10px;flex-wrap:wrap;padding-block:22px 120px;padding-left:var(--gl);padding-right:var(--gr)}
.foot-btn{display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:14px;border:1.5px solid var(--line);font-size:14px;font-weight:500}
.foot-btn b{font-variant-numeric:tabular-nums}

/* ---------- fab, trash, toast ---------- */
#fab{position:fixed;z-index:30;right:calc(var(--gr) + 4px);bottom:calc(env(safe-area-inset-bottom,0px) + 22px);width:62px;height:62px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;box-shadow:0 14px 30px -10px rgba(0,0,0,.45);transition:transform .3s var(--ease),opacity .25s,background-color .6s}
#fab:active{transform:scale(.92)}
#fab svg{transition:transform .35s var(--ease)}
#fab:hover svg{transform:rotate(90deg)}
body.is-dragging #fab,body.screen-open #fab{opacity:0;transform:scale(.6);pointer-events:none}
#trash{position:fixed;z-index:65;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 22px);display:flex;align-items:center;gap:8px;padding:14px 22px;border-radius:99px;white-space:nowrap;background:var(--paper);color:var(--danger);font-weight:600;box-shadow:0 14px 30px -10px rgba(0,0,0,.4),0 0 0 1px var(--line);transform:translate(-50%,calc(100% + 60px + env(safe-area-inset-bottom,0px)));visibility:hidden;transition:transform .35s var(--ease),visibility 0s linear .35s,background-color .2s,color .2s}
body.is-dragging #trash{transform:translate(-50%,0);visibility:visible;transition:transform .35s var(--ease),visibility 0s,background-color .2s,color .2s}
#trash.drop-hover{background:var(--danger);color:#fff;transform:translate(-50%,0) scale(1.08)}
#dropLine{position:fixed;z-index:66;height:3px;border-radius:2px;background:var(--accent);pointer-events:none;display:none;box-shadow:0 0 0 2px rgba(255,255,255,.35)}
.edge{position:fixed;z-index:64;top:0;bottom:0;width:30px;pointer-events:none;opacity:0;transition:opacity .2s}
.edge.l{left:0;background:linear-gradient(to right,var(--accent),transparent)}
.edge.r{right:0;background:linear-gradient(to left,var(--accent),transparent)}
.edge.on{opacity:.45}
#toast{position:fixed;z-index:90;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(env(safe-area-inset-bottom,0px) + 98px);max-width:calc(100% - 32px);display:flex;align-items:center;gap:14px;padding:12px 12px 12px 16px;border-radius:16px;background:var(--ink);color:var(--bg);font-size:14px;font-weight:500;box-shadow:0 16px 36px -14px rgba(0,0,0,.5);transform:translateY(24px);opacity:0;pointer-events:none;transition:transform .35s var(--ease),opacity .25s}
#toast.show{transform:none;opacity:1;pointer-events:auto}
#toast button{color:var(--accent);font-weight:700;padding:4px 8px;border-radius:8px;white-space:nowrap}
#toast span{min-width:0}
#fx{position:fixed;inset:0;z-index:95;pointer-events:none;width:100%;height:100%}
.tip{position:fixed;z-index:96;pointer-events:none;padding:6px 10px;border-radius:9px;background:var(--ink);color:var(--bg);font-size:12px;font-weight:600;white-space:nowrap;transform:translate(-50%,-100%);opacity:0;transition:opacity .15s}
.tip.show{opacity:1}

/* ---------- layers: drawer & sheet ---------- */
.layer{position:fixed;inset:0;pointer-events:none}
.layer.open{pointer-events:auto}
#drawerWrap{z-index:45}
#sheetWrap{z-index:55}
.scrim{position:absolute;inset:0;background:rgba(8,8,12,.42);opacity:0;transition:opacity .35s var(--ease)}
.layer.open .scrim{opacity:1}
.drawer{position:absolute;top:0;bottom:0;left:0;width:min(86%,380px);background:var(--paper);color:var(--ink);transform:translateX(-104%);transition:transform .45s var(--ease),background-color .6s;overflow-y:auto;overscroll-behavior:contain;padding-block:calc(env(safe-area-inset-top,0px) + 20px) calc(env(safe-area-inset-bottom,0px) + 28px);padding-left:max(20px, env(safe-area-inset-left, 0px));padding-right:20px;box-shadow:12px 0 40px -20px rgba(0,0,0,.5)}
.layer.open .drawer{transform:none}
.dr-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.dr-logo{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:28px;background:var(--accent);color:var(--accent-ink);flex:none}
.dr-name{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1}
.dr-sync{font-size:12px;color:var(--muted);margin-top:4px;display:flex;align-items:center;gap:6px}
.dr-sync i{width:7px;height:7px;border-radius:50%;background:var(--muted);flex:none}
.dr-sync.cloud i{background:#3E9C5A}
.dr-nav{display:flex;flex-direction:column;gap:2px;margin-bottom:22px}
.dr-nav button{display:flex;align-items:center;gap:14px;padding:12px 10px;border-radius:12px;font-size:16px;font-weight:500}
.dr-nav button:active,.sec-row:active{background:var(--line)}
.dr-nav em{margin-left:auto;font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.dr-h{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:6px 0 10px 10px}
.sec-list{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}
.sec-item{display:flex;align-items:center;gap:6px}
.sec-row{flex:1;min-width:0;display:flex;align-items:center;gap:12px;padding:11px 10px;border-radius:12px;font-size:15px;text-align:left}
.sec-row.on{background:var(--line);font-weight:600}
.sec-row i{width:12px;height:12px;border-radius:4px;background:var(--c,var(--ink));flex:none}
.sec-row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sec-row em{font-style:normal;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.sec-del{height:34px;min-width:34px;padding:0 8px;border-radius:10px;display:grid;place-items:center;color:var(--muted);font-size:13px;font-weight:600;transition:background-color .2s,color .2s}
.sec-del.confirm{background:var(--danger);color:#fff}
.sec-add{display:flex;flex-direction:column;gap:12px;padding:12px 10px 4px;margin-bottom:20px;border-top:1px solid var(--line)}
.sec-add-row{display:flex;gap:8px}
.sec-add input{flex:1;min-width:0;border:1.5px solid var(--line);background:transparent;border-radius:12px;padding:10px 12px;font-size:16px;outline:none}
.sec-add input:focus{border-color:var(--ink)}
.swatches{display:flex;flex-wrap:wrap;gap:8px}
.sw{width:28px;height:28px;border-radius:9px;background:var(--c);position:relative;transition:transform .2s var(--ease)}
.sw.on{transform:scale(1.12);box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--c)}
.themes{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:22px}
.theme-card{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;font-weight:500;text-align:center;color:var(--muted)}
.tc-bands{width:100%;aspect-ratio:3/4;max-width:100%;border-radius:12px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 0 0 1px var(--line);transition:transform .25s var(--ease),box-shadow .25s}
.tc-bands span{flex:1}
.theme-card.on{color:var(--ink);font-weight:700}
.theme-card.on .tc-bands{box-shadow:0 0 0 2px var(--paper),0 0 0 4px var(--accent);transform:translateY(-2px)}
.theme-card span.tc-name{line-height:1.2;overflow-wrap:anywhere}

.sheet{position:absolute;left:0;right:0;bottom:var(--kb);margin:0 auto;max-width:560px;max-height:calc(100% - env(safe-area-inset-top,0px) - 24px);overflow-y:auto;overscroll-behavior:contain;background:var(--paper);color:var(--ink);border-radius:24px 24px 0 0;transform:translateY(105%);transition:transform .42s var(--ease),bottom .2s;padding-top:8px;padding-left:var(--gl);padding-right:var(--gr);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 18px);box-shadow:0 -14px 40px -20px rgba(0,0,0,.45)}
.layer.open .sheet{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sh-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:4px}
.sh-title{font-family:var(--f-display);font-weight:800;font-size:24px;text-transform:uppercase;line-height:1.05;letter-spacing:.01em;text-wrap:balance}
.big-input{width:100%;font-size:21px;font-weight:600;border:0;border-bottom:1.5px solid var(--line);background:transparent;color:var(--ink);padding:12px 0 10px;outline:none;border-radius:0}
.big-input:focus{border-bottom-color:var(--ink)}
.big-input::placeholder{color:var(--muted);font-weight:500}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.fl{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:18px 0 9px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 calc(-1 * var(--gr)) 0 calc(-1 * var(--gl));padding:2px var(--gr) 4px var(--gl)}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:7px;border:1.5px solid var(--line);border-radius:99px;padding:8px 13px;font-size:14px;font-weight:500;white-space:nowrap;color:inherit;position:relative;transition:background-color .2s,border-color .2s,color .2s}
.chip i{width:9px;height:9px;border-radius:50%;background:var(--c)}
.chip.sel{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.sec.sel{background:var(--c);border-color:var(--c);color:#fff;text-shadow:0 1px 1px rgba(0,0,0,.25)}
.chip.sec.sel i{background:#fff}
.band .chip,.note .chip{border-color:currentColor;border-color:rgba(127,127,127,.4)}
.band .chip.sel,.note .chip.sel{background:currentColor}
.sh-actions{display:flex;gap:10px;margin-top:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:14px 18px;border-radius:16px;font-weight:600;font-size:16px}
.btn.primary{flex:1;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{border:1.5px solid var(--line)}
.btn.danger{color:var(--danger)}
.btn.danger.confirm{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.block{width:100%}

/* ---------- screens ---------- */
.screen{position:fixed;inset:0;z-index:40;margin:0 auto;max-width:560px;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);transform:translateX(104%);transition:transform .45s var(--ease),background-color .6s;padding-top:env(safe-area-inset-top,0px);box-shadow:-12px 0 40px -24px rgba(0,0,0,.5)}
.screen.open{transform:none}
.scr-head{flex:none;display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:8px;padding-block:8px 6px;padding-left:var(--gl);padding-right:var(--gr)}
.scr-title{font-family:var(--f-display);font-weight:800;font-size:28px;text-transform:uppercase;line-height:1;letter-spacing:.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.scr-body{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding-block:8px calc(env(safe-area-inset-bottom,0px) + 40px);padding-left:var(--gl);padding-right:var(--gr)}
.seg{display:inline-flex;background:var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{padding:7px 12px;border-radius:9px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap;transition:background-color .2s,color .2s}
.seg button.on{background:var(--paper);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.seg.wide{display:flex}
.seg.wide button{flex:1}
.card{background:var(--paper);border-radius:20px;padding:16px;margin-bottom:12px;box-shadow:0 0 0 1px var(--line)}
.card h3{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}

/* calendar */
.cal-nav{display:flex;align-items:center;justify-content:space-between;margin:10px 0 12px}
.cal-month{font-family:var(--f-display);font-weight:800;font-size:22px;text-transform:uppercase}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal-wd{text-align:center;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:4px 0}
.cc{aspect-ratio:1/1.08;max-width:100%;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:600;font-size:15px;font-variant-numeric:tabular-nums;position:relative}
.cc.out{opacity:.32}
.cc.past .cc-n{opacity:.55}
.cc.today .cc-n{color:var(--accent)}
.cc.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.cc.sel{background:var(--ink);color:var(--paper)}
.cc.sel .cc-n{color:var(--paper);opacity:1}
.cc-dots{display:flex;gap:2px;height:6px}
.cc-dots i{width:5px;height:5px;border-radius:50%;background:var(--c,var(--accent))}
.cc-dots i.h{background:transparent;box-shadow:inset 0 0 0 1.5px var(--c,currentColor)}
.cal-panel{margin-top:16px;background:var(--paper);border-radius:20px;padding:16px;box-shadow:0 0 0 1px var(--line)}
.cp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px}
.cp-title{font-weight:700;font-size:17px}
.cp-add{width:36px;height:36px;border-radius:12px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);flex:none}
.cal-panel .btn{margin-top:12px}
.wk-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;width:100%;text-align:left;background:var(--paper);border-radius:18px;padding:14px 16px;margin-bottom:8px;box-shadow:0 0 0 1px var(--line)}
.wk-row.cur{box-shadow:0 0 0 2px var(--accent)}
.wr-n{font-weight:700;font-size:15px}
.wr-range{color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.wr-tot{grid-column:2;grid-row:1 / span 2;align-self:center;font-size:13px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
.wr-days{grid-column:1 / -1;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:10px}
.wr-d{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10.5px;color:var(--muted);text-transform:uppercase;font-weight:600}
.wr-bar{width:100%;height:30px;border-radius:7px;background:var(--line);position:relative;overflow:hidden}
.wr-bar i{position:absolute;left:0;right:0;bottom:0;background:var(--accent);border-radius:5px 5px 0 0}
.wr-bar i.d{background:var(--muted);opacity:.45}

/* completed */
.dg{margin-bottom:18px}
.dg-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:6px 2px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
.dg-title{font-weight:700;font-size:15px}
.dg-n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.done-tools{display:flex;flex-direction:column;gap:12px;margin:6px 0 16px}
.empty-big{text-align:center;color:var(--muted);padding:40px 16px;font-size:15px;max-width:34ch;margin:0 auto}
.empty-big svg{margin:0 auto 14px;opacity:.5}

/* stats */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:12px}
.tile{background:var(--paper);border-radius:18px;padding:14px 12px 12px;box-shadow:0 0 0 1px var(--line);display:flex;flex-direction:column;gap:4px;min-width:0}
.tile b{font-family:var(--f-display);font-weight:800;font-size:36px;line-height:1;font-variant-numeric:tabular-nums}
.tile span{font-size:12px;color:var(--muted);line-height:1.25}
.tile em{font-style:normal;font-size:12px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.tile em.up{color:#2F8F4E}
.tile em.down{color:var(--danger)}
.ring{width:40px;height:40px}
.ring .bgc{fill:none;stroke:var(--line);stroke-width:5}
.ring .fgc{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round}
.tile-ring{display:flex;align-items:center;gap:8px}
.tile-ring b{font-size:26px}
.ins{display:flex;flex-direction:column;gap:12px}
.ins li{display:flex;gap:12px;font-size:15px;line-height:1.45}
.ins li::before{content:"";flex:none;width:8px;height:8px;margin-top:7px;border-radius:50%;background:var(--accent)}
.chart{width:100%;height:auto;overflow:visible}
.chart .bar path{fill:var(--accent)}
.chart .bar.dim path{opacity:.38}
.chart .hit{fill:transparent}
.chart .zero{fill:var(--line)}
.chart .axis{stroke:var(--line);stroke-width:1}
.chart .grid{stroke:var(--line);stroke-width:1;stroke-dasharray:2 4}
.chart .lbl{font:500 10px var(--f-body);fill:var(--muted);text-anchor:middle}
.chart .lbl.strong{fill:var(--ink);font-weight:700}
.chart .val{font:700 11px var(--f-body);fill:var(--ink);text-anchor:middle}
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:14px}
.part{border-radius:12px;padding:8px 6px;text-align:center;background:var(--bg);font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:2px}
.part b{font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.part.top{box-shadow:inset 0 0 0 1.5px var(--accent)}
.hbars{display:flex;flex-direction:column;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;font-size:14px}
.hb-name{display:flex;align-items:center;gap:8px;min-width:0}
.hb-name i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.hb-name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb-n{font-weight:600;font-variant-numeric:tabular-nums}
.hb-track{grid-column:1 / -1;height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.hb-track i{display:block;height:100%;border-radius:4px;background:var(--c)}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px 14px;align-items:baseline}
.kv b{font-family:var(--f-display);font-weight:800;font-size:24px;font-variant-numeric:tabular-nums;text-align:right}
.kv span{color:var(--muted);font-size:14px}
.stuck-row{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;border-bottom:1px solid var(--line);text-align:left;font-size:15px}
.stuck-row:last-child{border-bottom:0}
.stuck-row span{flex:1;min-width:0}
.stuck-row em{font-style:normal;font-size:12px;font-weight:700;color:var(--danger);white-space:nowrap}

/* grip, time, smart input, reminders */
.t-grip{flex:none;width:36px;height:34px;margin:-5px -10px -5px -4px;display:grid;place-items:center;opacity:.42;touch-action:none;cursor:grab}
.t-grip svg{pointer-events:none}
.task.ghost .t-grip{opacity:.8}
.t-time{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-variant-numeric:tabular-nums}
.t-rep{display:inline-flex;align-items:center;gap:4px}
.smart{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;font-size:13px}
.sm-l{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-weight:700}
.sm-chip{padding:4px 10px;border-radius:99px;background:var(--line);background:color-mix(in srgb,var(--accent) 16%,transparent);font-weight:600}
.fl-note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.4;max-width:60ch}
.remind{position:fixed;z-index:92;left:var(--gl);right:var(--gr);top:calc(env(safe-area-inset-top,0px) + 10px);margin:0 auto;max-width:520px;display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px 12px;padding:12px 8px 12px 12px;border-radius:20px;background:var(--paper);color:var(--ink);box-shadow:0 18px 40px -14px rgba(0,0,0,.5),0 0 0 1px var(--line);transform:translateY(calc(-100% - 40px));transition:transform .45s var(--ease)}
.remind.show{transform:none}
.rm-ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink)}
.remind.show .rm-ic{animation:ring 1s var(--ease) 2}
@keyframes ring{0%,100%{transform:rotate(0)}20%{transform:rotate(-14deg)}40%{transform:rotate(12deg)}60%{transform:rotate(-8deg)}80%{transform:rotate(5deg)}}
.rm-main{display:flex;flex-direction:column;gap:2px;min-width:0;font-size:15px}
.rm-main b{font-size:12.5px;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums}
.rm-main span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rm-acts{grid-column:2 / -1;display:flex;gap:8px;padding-right:4px}
.rm-acts button{display:inline-flex;align-items:center;gap:6px;padding:9px 14px;border-radius:12px;font-size:14px;font-weight:700;background:var(--line)}
.rm-acts button.go{background:var(--accent);color:var(--accent-ink)}
.chips.cal-chips{margin-top:12px}
.cal-legend{display:flex;justify-content:center;gap:18px;margin-top:10px;font-size:12px;color:var(--muted)}
.cal-legend span{display:inline-flex;align-items:center;gap:6px}
.cal-legend i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.cal-legend i.h{background:transparent;box-shadow:inset 0 0 0 1.5px var(--muted)}
.cp-sub{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}

/* splash */
#splash{position:fixed;inset:0;z-index:300;display:grid;place-items:center;overflow:hidden;background:var(--bg);color:var(--ink);transition:opacity .45s var(--ease),transform .45s var(--ease)}
#splash.out{opacity:0;transform:scale(1.06);pointer-events:none}
.sp-bands{position:absolute;inset:0;display:flex;flex-direction:column}
.sp-bands i{flex:1;background:var(--line);transform:scaleX(0);animation:spSweep .95s cubic-bezier(.65,0,.35,1) both;animation-delay:calc(var(--i) * 45ms)}
@keyframes spSweep{0%{transform:scaleX(0);transform-origin:0 50%}48%{transform:scaleX(1);transform-origin:0 50%}52%{transform:scaleX(1);transform-origin:100% 50%}100%{transform:scaleX(0);transform-origin:100% 50%}}
.sp-center{position:relative;display:flex;flex-direction:column;align-items:center;gap:16px}
.sp-logo{width:108px;height:108px;border-radius:30px;display:grid;place-items:center;background:var(--accent);color:var(--accent-ink);box-shadow:0 22px 44px -18px rgba(0,0,0,.45);animation:spLogo .75s cubic-bezier(.3,1.6,.5,1) .5s both}
.sp-logo svg{width:78px;height:78px}
@keyframes spLogo{0%{opacity:0;transform:scale(.3) rotate(-20deg)}100%{opacity:1;transform:none}}
.sp-name{display:flex;overflow:hidden;padding-left:.08em;font-family:var(--f-display);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:.08em}
.sp-name span{display:inline-block;animation:spChar .55s var(--ease) both;animation-delay:calc(.75s + var(--i) * 55ms)}
@keyframes spChar{0%{opacity:0;transform:translateY(85%)}100%{opacity:1;transform:none}}
.sp-tag{min-height:1.4em;font-size:14px;letter-spacing:.02em;color:var(--muted);animation:spFade .5s ease 1.1s both}
@keyframes spFade{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:none}}
.dr-logo svg{width:32px;height:32px}
/* settings */
.dr-seg{margin-bottom:22px}
.set-list{display:flex;flex-direction:column;gap:2px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;padding:12px 10px;border-radius:12px;font-size:15px;text-align:left;cursor:pointer}
button.set-row:active{background:var(--line)}
.set-l{display:flex;flex-direction:column;gap:3px;min-width:0}
.set-l small{font-size:12px;line-height:1.35;color:var(--muted)}
.set-ok{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:13px;font-weight:600;color:#2F8F4E;white-space:nowrap}
.tog{-webkit-appearance:none;appearance:none;flex:none;position:relative;width:48px;height:29px;margin:0;border-radius:99px;background:var(--line);cursor:pointer;transition:background-color .25s}
.tog::before{content:"";position:absolute;top:3px;left:3px;width:23px;height:23px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .25s var(--ease)}
.tog:checked{background:var(--accent)}
.tog:checked::before{transform:translateX(19px)}
.btn.sm-btn{flex:none;padding:9px 14px;font-size:14px;border-radius:12px}
.backup-btns{display:flex;gap:8px;padding:0 10px 4px}
.file-btn{position:relative;overflow:hidden;cursor:pointer}
.file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.cal-btn{margin-top:22px}
/* in-app date and time pickers */
.mc,.tp{margin-top:10px;padding:12px;border-radius:18px;background:var(--bg);box-shadow:inset 0 0 0 1px var(--line);animation:pickIn .32s var(--ease)}
.note .mc{background:rgba(127,127,127,.1);box-shadow:none}
@keyframes pickIn{0%{opacity:0;transform:translateY(-6px)}100%{opacity:1;transform:none}}
.mc-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mc-head b{font-size:15px;font-weight:700}
.mc-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:2px}
.mc-wd{padding:4px 0;text-align:center;font-size:11px;font-weight:700;text-transform:uppercase;opacity:.5}
.mc-d{height:38px;border-radius:11px;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
.mc-d.out{opacity:.35}
.mc-d:disabled{opacity:.2;cursor:default}
.mc-d.today{box-shadow:inset 0 0 0 1.5px var(--accent)}
.mc-d.sel{background:var(--accent);color:var(--accent-ink);opacity:1}
.mc-d:not(:disabled):active{background:var(--line)}
.tp-l{margin:2px 0 6px;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tp-grid{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:4px;margin-bottom:10px}
.tp-grid:last-child{margin-bottom:0}
.tp-b{height:36px;border-radius:10px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--line);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.tp-b.sel{background:var(--accent);color:var(--accent-ink);box-shadow:none}

.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#holder{position:fixed;left:-9999px;top:0;width:10px;height:10px;overflow:hidden;visibility:hidden}

@media (min-width:600px){
  #app{box-shadow:0 0 0 1px var(--line)}
  #fab{right:calc(50vw - 280px + 20px)}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important}
}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <button class="icon-btn" data-act="menu" id="menuBtn" aria-label="Меню">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M4 7h16M4 12h10M4 17h16"/></svg>
    </button>
    <div class="wk">
      <button class="wk-arrow" data-act="week-prev" id="wkPrev" aria-label="Прошлая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="wk-label" data-act="go-today"><span class="wk-range" id="wkRange">&nbsp;</span><span class="wk-sub" id="wkSub">&nbsp;</span></button>
      <button class="wk-arrow" data-act="week-next" id="wkNext" aria-label="Следующая неделя"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <button class="icon-btn" data-act="open-cal" id="calBtn" aria-label="Календарь">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M8 3v4M16 3v4M3.5 10h17"/><circle cx="12" cy="15" r="1.3" fill="currentColor" stroke="none"/></svg>
    </button>
  </header>
  <main id="scroller">
    <div id="filterBar" class="filter-bar" hidden></div>
    <section id="inbox" class="note" data-drop="inbox"></section>
    <div id="week" class="week"></div>
    <div id="foot" class="foot"></div>
  </main>
</div>

<button id="fab" data-act="fab" aria-label="Новая цель"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>
<div id="trash" data-drop="trash"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12.5a2 2 0 0 0 2 1.5h6a2 2 0 0 0 2-1.5L18 7M9 7V4.5h6V7"/></svg><span id="trashLabel">Удалить</span></div>
<div id="dropLine"></div>
<div class="edge l" id="edgeL"></div><div class="edge r" id="edgeR"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="remind" class="remind" role="alert"></div>
<div id="tip" class="tip"></div>

<div id="drawerWrap" class="layer" inert><div class="scrim" data-act="close-drawer"></div><aside id="drawer" class="drawer" aria-label="Меню"></aside></div>
<section id="scrCal" class="screen" inert></section>
<section id="scrDone" class="screen" inert></section>

const calOk = x => !ui.calFilter || x.section === ui.calFilter;
const planOn = k => allTasks().filter(x => !x.done && x.date && eff(x) === k && calOk(x)).sort(byTimeOrder);
const doneOn = k => allTasks().filter(x => x.done && x.doneAt && keyOf(new Date(x.doneAt)) === k && calOk(x)).sort((a, b) => a.doneAt - b.doneAt);
function calCell(d, monthIdx){

  const col = x => { const s = secOf(x.section); return s ? ` style="--c:${s.color}"` : ''; };

  const cls = ['cc']; if (d.getMonth() !== monthIdx) cls.push('out'); if (k === TK) cls.push('today'); if (k === ui.calSel) cls.push('sel'); if (k < TK) cls.push('past');

function renderCal(){
  const m = ui.calMonth, first = startOfWeek(m), monthIdx = m.getMonth();
  const monthTitle = cap(fmt(m, {month:'long', year:'numeric'})).replace(/\s?г\.$/, '');

      + (pend.length ? `<div class="cp-sub">${esc(t('planned'))} · ${pend.length}</div><ul class="tasks">${pend.map(x => taskRow(x, {noGrip:true})).join('')}</ul>` : '')
      + (done.length ? `<div class="cp-sub">${esc(t('archiveDay'))} · ${done.length}</div><ul class="tasks">${done.map(x => taskRow(x, {time:true, noGrip:true})).join('')}</ul>` : '')

  } else {

      body += `<button class="wk-row${wk === curWs ? ' cur' : ''}" data-act="cal-week" data-k="${wk}"><span class="wr-n">${esc(t('weekN', {n: isoWeek(ws)}))}</span><span class="wr-range">${esc(fmtRange(ws, addDays(ws, 6)))}</span><span class="wr-tot">${esc(pl('goalsPl', tp))}<br>✓ ${td}</span><span class="wr-days">${cols}</span></button>`;
      ws = addDays(ws, 7);

  $('#scrCal').innerHTML = scrHead(t('calendar')) + `<div class="scr-body">${seg}${chips}${body}</div>`;
}

function renderUp(){

/* ---------- statistics ---------- */
function computeStats(){
  const all = allTasks(), done = all.filter(x => x.done && x.doneAt), today0 = parseKey(TK);
  const dk = ts => keyOf(new Date(ts));
  const byDay = {}; done.forEach(x => { const k = dk(x.doneAt); byDay[k] = (byDay[k] || 0) + 1; });
  const last14 = []; for (let i = 13; i >= 0; i--){ const k = keyOf(addDays(today0, -i)); last14.push({k, n: byDay[k] || 0}); }
  const sumBack = (from, to) => { let s = 0; for (let i = from; i <= to; i++) s += byDay[keyOf(addDays(today0, -i))] || 0; return s; };
  const w0 = sumBack(0, 6), w1 = sumBack(7, 13);
  const ws = keyOf(startOfWeek(today0)), we = keyOf(addDays(startOfWeek(today0), 6));
  const doneWeek = done.filter(x => { const k = x.date || dk(x.doneAt); return k >= ws && k <= we; }).length;
  const pendWeek = all.filter(x => !x.done && x.date && eff(x) >= ws && eff(x) <= we).length;
  const rate = doneWeek + pendWeek ? Math.round(doneWeek / (doneWeek + pendWeek) * 100) : 0;
  let streak = 0, d = today0; if (!byDay[TK]) d = addDays(d, -1);
  while (byDay[keyOf(d)]){ streak++; d = addDays(d, -1); }
  let best = 0, run = 0, prev = null;
  Object.keys(byDay).sort().forEach(k => { run = (prev && diffDays(prev, k) === 1) ? run + 1 : 1; best = Math.max(best, run); prev = k; });
  const from56 = addDays(today0, -55).getTime(), wd = [0,0,0,0,0,0,0], parts = [0,0,0,0];
  done.forEach(x => {
    if (x.doneAt >= from56) wd[(new Date(x.doneAt).getDay() + 6) % 7]++;
    const h = new Date(x.doneAt).getHours(); parts[h >= 5 && h < 12 ? 0 : h >= 12 && h < 17 ? 1 : h >= 17 && h < 23 ? 2 : 3]++;
  });
  const from30 = addDays(today0, -29).getTime(), secCount = {};
  done.forEach(x => { if (x.doneAt >= from30){ const s = secOf(x.section) ? x.section : '_'; secCount[s] = (secCount[s] || 0) + 1; } });
  const recent = done.filter(x => x.doneAt >= addDays(today0, -59).getTime());
  const onTime = recent.length ? Math.round(recent.filter(x => !x.carried).length / recent.length * 100) : null;
  const leads = recent.filter(x => x.createdAt && x.doneAt > x.createdAt).map(x => (x.doneAt - x.createdAt) / 3600000).sort((a, b) => a - b);
  const lead = leads.length ? leads[Math.floor(leads.length / 2)] : null;
  const stuck = all.filter(x => !x.done && x.date && x.date < TK).map(x => ({x, n: diffDays(x.date, TK)})).sort((a, b) => b.n - a.n);
  const days28 = sumBack(0, 27) / 28;
  const upcoming = []; for (let i = 0; i < 7; i++){ const k = keyOf(addDays(today0, i)); upcoming.push({k, n: all.filter(x => !x.done && x.date && eff(x) === k).length}); }
  return {done, last14, w0, w1, rate, doneWeek, pendWeek, streak, best, wd, parts, secCount, onTime, lead, stuck, days28, upcoming, open: all.filter(x => !x.done).length};
}
function insights(st){
  const out = [];
  if (st.done.length < 3) return [t('insStart')];
  if (st.w1 > 0 || st.w0 > 0){
    if (st.w1 === 0) out.push(t('insUp', {p: 100}));
    else { const p = Math.round((st.w0 - st.w1) / st.w1 * 100); out.push(Math.abs(p) < 8 ? t('insSame') : p > 0 ? t('insUp', {p}) : t('insDown', {p: -p})); }
  }
  const wdTotal = st.wd.reduce((a, b) => a + b, 0);
  if (wdTotal >= 6){ const i = st.wd.indexOf(Math.max(...st.wd)); out.push(t('insBest', {d: fmt(addDays(startOfWeek(parseKey(TK)), i), {weekday:'long'})})); }
  const stuck3 = st.stuck.filter(s => s.n > 3).length;
  if (stuck3) out.push(t('insStuck', {n: stuck3}));
  const avg = Math.max(1, Math.round(st.days28 * 10) / 10);
  const over = st.upcoming.find(u => u.n >= 4 && u.n >= avg * 1.8);
  if (over) out.push(t('insOverload', {d: cap(fmt(parseKey(over.k), {weekday:'long'})), n: over.n, a: avg}));
  if (st.streak >= 2) out.push(t('insStreak', {n: st.streak}));
  const pTotal = st.parts.reduce((a, b) => a + b, 0);
  if (pTotal >= 5){ const i = st.parts.indexOf(Math.max(...st.parts)); out.push(t(['insMorning','insAfternoon','insEvening','insNight'][i])); }
  const secs = Object.entries(st.secCount).filter(([k]) => k !== '_').sort((a, b) => b[1] - a[1]);
  if (secs.length && secs[0][1] >= 3) out.push(t('insTop', {s: secOf(secs[0][0]).name}));
  if (st.onTime !== null && st.done.length >= 5) out.push(t('insOnTime', {p: st.onTime}));
  return out.slice(0, 5);
}
function roundTop(x, y, w, h, r){ r = Math.min(r, w / 2, h); return `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`; }
function barChart(items, hiIdx, aria){
  const W = 340, H = 150, top = 20, bottom = 24, n = items.length, max = Math.max(1, ...items.map(d => d.n));
  const step = W / n, bw = Math.min(22, step * .6), y0 = H - bottom, ph = y0 - top;
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(aria)}"><line class="grid" x1="0" x2="${W}" y1="${top + ph / 2}" y2="${top + ph / 2}"/><line class="axis" x1="0" x2="${W}" y1="${y0}" y2="${y0}"/>`;
  items.forEach((d, i) => {
    const x = step * i + (step - bw) / 2, h = d.n ? Math.max(4, ph * d.n / max) : 0, y = y0 - h, hi = hiIdx.includes(i);
    s += `<g class="bar${hi ? '' : ' dim'}" data-tip="${esc(d.tip)}"><rect class="hit" x="${step * i}" y="0" width="${step}" height="${H}"/>`
      + (h ? `<path d="${roundTop(x, y, bw, h, 4)}"/>` : `<rect class="zero" x="${x}" y="${y0 - 2}" width="${bw}" height="2"/>`)
      + ((d.n && (d.n === max || hi)) ? `<text class="val" x="${x + bw / 2}" y="${y - 5}">${d.n}</text>` : '')
      + `<text class="lbl${hi ? ' strong' : ''}" x="${x + bw / 2}" y="${H - 7}">${esc(d.label)}</text></g>`;
  });
  return s + '</svg>';
}
function renderStats(){
  const st = computeStats();
  const trend = st.w1 ? Math.round((st.w0 - st.w1) / st.w1 * 100) : (st.w0 ? 100 : 0);
  const C = 2 * Math.PI * 16;
  let h = `<div class="tiles">`
    + `<div class="tile"><b>${st.w0}</b><span>${esc(t('sWeekDone'))}</span>${trend ? `<em class="${trend > 0 ? 'up' : 'down'}">${trend > 0 ? '↑' : '↓'} ${Math.abs(trend)}%</em>` : ''}</div>`
    + `<div class="tile"><div class="tile-ring"><svg class="ring" viewBox="0 0 40 40" aria-hidden="true"><circle class="bgc" cx="20" cy="20" r="16"/><circle class="fgc" cx="20" cy="20" r="16" stroke-dasharray="${C * st.rate / 100} ${C}" transform="rotate(-90 20 20)"/></svg><b>${st.rate}%</b></div><span>${esc(t('sWeekRate'))}</span><em>${st.doneWeek}/${st.doneWeek + st.pendWeek}</em></div>`
    + `<div class="tile"><b>${st.streak}</b><span>${esc(t('sStreak'))}</span><em>${esc(t('sBest', {n: st.best}))}</em></div></div>`;
  h += `<section class="card"><h3>${esc(t('sInsights'))}</h3><ul class="ins">${insights(st).map(s => `<li>${esc(s)}</li>`).join('')}</ul></section>`;
  const l14 = st.last14.map(d => { const dd = parseKey(d.k); return {n: d.n, label: String(dd.getDate()), tip: `${shortDate(d.k)} · ${d.n}`}; });
  h += `<section class="card"><h3>${esc(t('sLast14'))}</h3>${barChart(l14, [13], t('sLast14'))}</section>`;
  const ws = startOfWeek(parseKey(TK)), wdMax = Math.max(...st.wd);
  const wdItems = st.wd.map((n, i) => ({n, label: cap(fmt(addDays(ws, i), {weekday:'short'}).replace('.', '')), tip: `${cap(fmt(addDays(ws, i), {weekday:'long'}))} · ${n}`}));
  const pMax = Math.max(...st.parts);
  h += `<section class="card"><h3>${esc(t('sWhen'))}</h3>${barChart(wdItems, wdMax ? st.wd.map((n, i) => n === wdMax ? i : -1).filter(i => i >= 0) : [], t('sWhen'))}`
    + `<div class="parts">${['morning','afternoon','evening','night'].map((k, i) => `<div class="part${pMax && st.parts[i] === pMax ? ' top' : ''}"><b>${st.parts[i]}</b>${esc(t(k))}</div>`).join('')}</div></section>`;
  const secRows = Object.entries(st.secCount).sort((a, b) => b[1] - a[1]);
  const sMax = Math.max(1, ...secRows.map(r => r[1]));
  h += `<section class="card"><h3>${esc(t('sSections'))}</h3>` + (secRows.length ? `<div class="hbars">${secRows.map(([id, n]) => { const s = secOf(id); const c = s ? s.color : 'var(--muted)'; return `<div class="hb" style="--c:${c}"><span class="hb-name"><i></i><span>${esc(s ? s.name : t('noSec'))}</span></span><span class="hb-n">${n}</span><span class="hb-track"><i style="width:${n / sMax * 100}%"></i></span></div>`; }).join('')}</div>` : `<p class="empty">${esc(t('insStart'))}</p>`) + `</section>`;

const fx = {cv: $('#fx'), ctx: null, parts: [], run: false};
fx.ctx = fx.cv.getContext('2d');
function sparks(x, y, color){
  if (reduced) return;
  const dpr = Math.min(2, devicePixelRatio || 1);
  if (fx.cv.width !== innerWidth * dpr){ fx.cv.width = innerWidth * dpr; fx.cv.height = innerHeight * dpr; }
  const cols = [color, TH().accent, '#FFD36E', '#FFF6D8'];
  for (let i = 0; i < 30; i++){
    const a = Math.random() * Math.PI * 2, sp = 2.4 + Math.random() * 6;
    fx.parts.push({x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.8, life: 1, dec: .016 + Math.random() * .02, size: 1.4 + Math.random() * 2.6, c: cols[i % cols.length], star: i % 3 === 0, rot: Math.random() * 3});
  }
  fx.parts.push({ring: true, x, y, r: 6, life: 1, c: color});

}
function fxLoop(){
  const c = fx.ctx, dpr = fx.cv.width / innerWidth;
  c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
  fx.parts = fx.parts.filter(p => p.life > 0);
  for (const p of fx.parts){
    c.globalAlpha = Math.max(0, p.life);
    if (p.ring){ p.r += 2.6; p.life -= .055; c.strokeStyle = p.c; c.lineWidth = 2.5 * p.life; c.beginPath(); c.arc(p.x, p.y, p.r, 0, 7); c.stroke(); continue; }
    p.vx *= .955; p.vy = p.vy * .955 + .2; p.x += p.vx; p.y += p.vy; p.life -= p.dec; p.rot += .2;
    c.fillStyle = p.c;

      const s = p.size * 2.2; c.save(); c.translate(p.x, p.y); c.rotate(p.rot); c.beginPath();
      for (let k = 0; k < 4; k++){ c.rotate(Math.PI / 2); c.moveTo(0, 0); c.quadraticCurveTo(s * .18, s * .18, 0, s); c.quadraticCurveTo(-s * .18, s * .18, 0, 0); }
      c.fill(); c.restore();
    } else { c.beginPath(); c.arc(p.x, p.y, p.size, 0, 7); c.fill(); }
  }
  c.globalAlpha = 1;
  if (fx.parts.length) requestAnimationFrame(fxLoop); else { fx.run = false; c.clearRect(0, 0, innerWidth, innerHeight); }

  }
  if (out.date !== undefined) out.hits.push(out.date === TK ? t('today') : out.date === addK(1) ? t('tomorrow') : shortDate(out.date));
  if (out.time) out.hits.push(out.time);
  if (out.section) out.hits.push(secOf(out.section).name);
  if (out.repeat) out.hits.push(t(REPEAT_KEYS[out.repeat]));
  let title = s.replace(/\s{2,}/g, ' ').replace(/\s+([,.!?;])/g, '$1').trim();
  title = title.replace(/(^|\s)(в|во|к|на|on|at|à|a|el|le|de|por|pour|для)$/iu, '').replace(/^[\s,;.\-–—]+|[\s,;\-–—]+$/g, '').trim();
  const c0 = text.trim().charAt(0);
  if (title && c0 && c0 === c0.toLocaleUpperCase() && c0 !== c0.toLocaleLowerCase()) title = title.charAt(0).toLocaleUpperCase() + title.slice(1);
  out.title = title;
  return out;
}

/* ================= reminders while the page is open ================= */
const FIRED_KEY = 'weeky:fired';
let fired = {};
try { fired = JSON.parse(localStorage.getItem(FIRED_KEY) || '{}') || {}; } catch(_) { fired = {}; }
function saveFired(){
  const cut = Date.now() - 3 * 86400000;
  for (const k in fired) if (!fired[k] || fired[k].at < cut) delete fired[k];
  try { localStorage.setItem(FIRED_KEY, JSON.stringify(fired)); } catch(_){}
}
const remindKey = x => `${x.id}@${eff(x)}@${x.time}@${x.remind}`;
const dueAt = x => { const [h, m] = x.time.split(':').map(Number), d = parseKey(eff(x)); d.setHours(h, m, 0, 0); return d.getTime(); };
const remQ = [];
let remCur = null;
function checkReminders(){
  const now = Date.now(); let changed = false;
  for (const x of allTasks()){
    if (x.done || !x.date || !x.time || x.remind == null || eff(x) !== TK) continue;
    const k = remindKey(x), f = fired[k], at = dueAt(x) - x.remind * 60000;
    if (f){ if (!f.snooze || now < f.snooze) continue; }
    else {
      if (now < at) continue;
      // set after its moment, or long missed: stay quiet
      if (now - at > 6 * 3600000 || at < (x.remindFrom || x.createdAt || 0)){ fired[k] = {at: now}; changed = true; continue; }
    }
    if ((remCur && remCur.k === k) || remQ.some(r => r.k === k)) continue;
    fired[k] = {at: now}; changed = true; remQ.push({k, id: x.id});
  }
  if (changed) saveFired();
  showReminder();
}
function showReminder(){
  if (remCur) return;
  while (remQ.length && !remCur){ const r = remQ.shift(), x = S.tasks[r.id]; if (x && !x.done) remCur = r; }
  if (!remCur) return;
  const x = S.tasks[remCur.id], mins = Math.round((dueAt(x) - Date.now()) / 60000), el = $('#remind');
  const when = `${x.time} · ${mins > 0 ? t('remindIn', {n: mins}) : t('remindNow')}`;
  el.innerHTML = `<span class="rm-ic">${ICON.bellBig}</span><span class="rm-main"><b>${esc(when)}</b><span>${esc(x.title)}</span></span>`
    + `<button class="icon-btn sm" data-act="rm-close" aria-label="${esc(t('close'))}">${ICON.close}</button>`
    + `<span class="rm-acts"><button class="go" data-act="rm-done">${ICON.tickS}${esc(t('doneBtn'))}</button><button data-act="rm-snooze">${esc(t('snooze'))}</button></span>`;
  el.classList.add('show');
  if (S.sound !== false) chime();
  haptic([90, 60, 90]);
  if (document.visibilityState !== 'visible') sysNotify(x.title, when);
}
function hideReminder(){ $('#remind').classList.remove('show'); remCur = null; setTimeout(showReminder, 500); }
let actx = null;
document.addEventListener('pointerdown', () => {
  if (actx){ if (actx.state === 'suspended') actx.resume(); return; }
  try { const C = window.AudioContext || window.webkitAudioContext; if (C) actx = new C(); } catch(_){}
}, {passive: true});
function chime(){
  if (!actx) return;
  try {
    const t0 = actx.currentTime;
    [880, 1318.5].forEach((f, i) => {
      const o = actx.createOscillator(), gn = actx.createGain(), st = t0 + i * .18;
      o.type = 'sine'; o.frequency.value = f;
      gn.gain.setValueAtTime(.0001, st); gn.gain.exponentialRampToValueAtTime(.2, st + .02); gn.gain.exponentialRampToValueAtTime(.0001, st + .5);
      o.connect(gn); gn.connect(actx.destination); o.start(st); o.stop(st + .55);
    });
  } catch(_){}
}

/* ================= device: haptics, notifications, calendar files, backup ================= */
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
const standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
let swReg = null, hapticLabel = null;
function haptic(p){
  if (S.haptics === false) return;
  if (typeof navigator.vibrate === 'function'){ try { navigator.vibrate(p); } catch(_){} return; }
  if (!isIOS) return;
  // Safari has no vibrate(); flipping a native switch inside a tap gives a haptic tick (iOS 18+)
  if (!hapticLabel){
    hapticLabel = document.createElement('label');
    hapticLabel.setAttribute('aria-hidden', 'true');
    hapticLabel.style.cssText = 'position:fixed;left:-200px;top:0;width:1px;height:1px;overflow:hidden;opacity:0';
    const sw = document.createElement('input'); sw.type = 'checkbox'; sw.tabIndex = -1; sw.setAttribute('switch', '');
    hapticLabel.appendChild(sw); document.body.appendChild(hapticLabel);
  }
  try { hapticLabel.click(); } catch(_){}
}
function notifState(){
  if (!('Notification' in window)) return isIOS && !standalone ? 'install' : 'none';
  return Notification.permission;
}
function notifRow(){
  const st = notifState();
  const sub = st === 'denied' ? t('notifBlocked') : st === 'install' ? t('notifInstall') : st === 'none' ? t('notifNone') : t('notifNote');
  const right = st === 'granted' ? `<span class="set-ok">${ICON.tickS}${esc(t('notifOn'))}</span>`
    : st === 'default' ? `<button class="btn primary sm-btn" data-act="notif-enable">${esc(t('notifEnable'))}</button>` : '';
  return `<div class="set-row"><span class="set-l">${esc(t('notif'))}<small>${esc(sub)}</small></span>${right}</div>`;
}
async function enableNotif(){
  try { if ((await Notification.requestPermission()) === 'granted') sysNotify('Weeky', t('notifTest')); } catch(_){}
  renderDrawer();
}
async function sysNotify(title, body){
  if (notifState() !== 'granted') return;
  const opts = {body, icon: 'icon-192.png', badge: 'icon-192.png', tag: 'weeky-' + Date.now()};
  try {
    const reg = swReg || (navigator.serviceWorker && await navigator.serviceWorker.getRegistration());
    if (reg){ await reg.showNotification(title, opts); return; }
  } catch(_){}
  try { new Notification(title, opts); } catch(_){}
}
function saveFile(name, text, type){
  const url = URL.createObjectURL(new Blob([text], {type}));
  if (isIOS && type.indexOf('text/calendar') === 0) location.href = url;   // Safari shows its "Add to Calendar" sheet
  else { const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
  setTimeout(() => URL.revokeObjectURL(url), 60000);
}
const RRULES = {daily: 'FREQ=DAILY', weekdays: 'FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR', weekly: 'FREQ=WEEKLY', monthly: 'FREQ=MONTHLY'};
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
const icsDay = k => k.replace(/-/g, '');
function icsFold(line){ let out = line.slice(0, 36), rest = line.slice(36); while (rest){ out += '\r\n ' + rest.slice(0, 36); rest = rest.slice(36); } return out; }
// Floating local times, so the phone's Calendar alarms at the same clock time Weeky shows.
function icsEvent(x){
  const d = eff(x) || x.date, sec = secOf(x.section), stamp = new Date().toISOString().replace(/[-:]/g, '').replace(/\.\d{3}/, '');
  const L = ['BEGIN:VEVENT', 'UID:' + x.id + '@weeky', 'DTSTAMP:' + stamp, 'SUMMARY:' + icsEsc(x.title)];
  if (x.time){
    const [h, m] = x.time.split(':').map(Number), end = parseKey(d); end.setHours(h, m + 30);
    L.push('DTSTART:' + icsDay(d) + 'T' + pad(h) + pad(m) + '00', 'DTEND:' + icsDay(keyOf(end)) + 'T' + pad(end.getHours()) + pad(end.getMinutes()) + '00');
  } else L.push('DTSTART;VALUE=DATE:' + icsDay(d), 'DTEND;VALUE=DATE:' + icsDay(keyOf(addDays(parseKey(d), 1))));
  if (sec) L.push('CATEGORIES:' + icsEsc(sec.name), 'DESCRIPTION:' + icsEsc('Weeky · ' + sec.name));
  if (x.repeat) L.push('RRULE:' + RRULES[x.repeat]);
  L.push('BEGIN:VALARM', 'ACTION:DISPLAY', 'DESCRIPTION:' + icsEsc(x.title), 'TRIGGER:' + (x.time ? '-PT' + (x.remind || 0) + 'M' : 'PT9H'), 'END:VALARM', 'END:VEVENT');
  return L.map(icsFold).join('\r\n');
}
const icsFile = list => ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Weeky//Planner//RU', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH'].concat(list.map(icsEvent), 'END:VCALENDAR').join('\r\n') + '\r\n';
function exportBackup(){
  saveFile(`weeky-${TK}.json`, JSON.stringify({app: 'weeky', v: 1, exportedAt: new Date().toISOString(), data: S}), 'application/json');
}
function importBackup(file){
  const r = new FileReader();
  r.onload = () => {
    try {
      const j = JSON.parse(r.result), raw = j && j.app === 'weeky' ? j.data : j;
      if (!raw || !raw.tasks || typeof raw.tasks !== 'object') throw new Error('not a backup');
      const prev = S, apply = st => { S = st; lang = S.lang; applyTheme(); persist(); renderAll(); renderDrawer(); };
      apply(sanState(raw));
      toast(t('backupDone'), t('undo'), () => apply(prev));
    } catch(_){ toast(t('backupBad')); }
  };
  r.readAsText(file);
}

/* ================= launch: splash, then the week cascades in ================= */
function introAnim(){
  if (reduced) return;
  $('#inbox').animate([{opacity: 0, transform: 'translateY(-10px) rotate(-1deg)'}, {opacity: 1, transform: 'none'}], {duration: 520, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards'});
  [...$('#week').children].forEach((b, i) => b.animate([{opacity: 0, transform: 'translateY(28px)'}, {opacity: 1, transform: 'none'}], {duration: 560, delay: 80 + i * 55, easing: 'cubic-bezier(.2,.8,.2,1)', fill: 'backwards'}));
}
function runSplash(done){
  const sp = $('#splash');
  if (!sp){ done(); return; }
  if (reduced){ sp.remove(); done(); return; }
  const bands = bandsOf(S.theme);
  sp.querySelectorAll('.sp-bands i').forEach((el, i) => { el.style.background = bands[i].bg; });
  sp.querySelector('.sp-tag').textContent = t('splashTag');
  let over = false;
  const finish = () => { if (over) return; over = true; sp.classList.add('out'); setTimeout(() => sp.remove(), 480); done(); };
  sp.addEventListener('pointerdown', finish);
  setTimeout(finish, 2700);
}

/* ================= day rollover & boot ================= */
function checkDay(){
  const k = keyOf(new Date()); if (k === TK) return;
  const wasCurrent = isCurrentWeek();
  TK = k;
  if (wasCurrent) ui.weekStart = startOfWeek(parseKey(TK));
  ui.open.add(TK);
  renderAll();
}
setInterval(checkDay, 30000);
document.addEventListener('visibilitychange', () => { if (!document.hidden){ checkDay(); checkReminders(); } });
setInterval(checkReminders, 15000);
if (window.visualViewport){
  const vv = window.visualViewport;
  const upd = () => document.documentElement.style.setProperty('--kb', Math.max(0, innerHeight - vv.height - vv.offsetTop) + 'px');
  vv.addEventListener('resize', upd); vv.addEventListener('scroll', upd);
}

applyTheme();
renderAll();
runSplash(() => { introAnim(); checkReminders(); });
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1'))
  navigator.serviceWorker.register('sw.js').then(r => { swReg = r; }).catch(() => {});
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch(_){}
})();
</script>
